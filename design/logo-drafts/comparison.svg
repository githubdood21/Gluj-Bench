<text x="968" y="75" text-anchor="end" font-size="12" fill="#8294ab">Two directions / draft 01</text><rect x="32" y="108" width="452" height="516" rx="24" fill="#141e2c" stroke="#2c3b51"/><use href="#chip" transform="translate(130,128)"/><text x="60" y="407" fill="#edf4fb" font-size="23" font-weight="600">01  Loop + chip</text><text x="60" y="435" fill="#9eb1c7" font-size="14">Hardware at the centre of every retest.</text><path d="M60 463H456" stroke="#2c3b51"/><text x="60" y="491" fill="#7f96b0" font-size="10" letter-spacing="1.5">SMALL ICON CHECK</text><use href="#chip" transform="translate(76, 521.0) scale(0.1875)"/><text x="100.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">48px</text><use href="#chip" transform="translate(187, 529.0) scale(0.125)"/><text x="203.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">32px</text><use href="#chip" transform="translate(292, 533.0) scale(0.09375)"/><text x="304.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">24px</text><use href="#chip" transform="translate(391, 537.0) scale(0.0625)"/><text x="399.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">16px</text><rect x="516" y="108" width="452" height="516" rx="24" fill="#141e2c" stroke="#2c3b51"/><use href="#wave" transform="translate(614,128)"/><text x="544" y="407" fill="#edf4fb" font-size="23" font-weight="600">02  Loop + waveform</text><text x="544" y="435" fill="#9eb1c7" font-size="14">Measure how the workload behaves.</text><path d="M544 463H940" stroke="#2c3b51"/><text x="544" y="491" fill="#7f96b0" font-size="10" letter-spacing="1.5">SMALL ICON CHECK</text><use href="#wave" transform="translate(560, 521.0) scale(0.1875)"/><text x="584.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">48px</text><use href="#wave" transform="translate(671, 529.0) scale(0.125)"/><text x="687.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">32px</text><use href="#wave" transform="translate(776, 533.0) scale(0.09375)"/><text x="788.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">24px</text><use href="#wave" transform="translate(875, 537.0) scale(0.0625)"/><text x="883.0" y="593" text-anchor="middle" fill="#94a8c1" font-size="11">16px</text><text x="32" y="653" fill="#778da7" font-size="12">Open arrows = test / adjust / retest. No ranking, trophy or invented score.</text></g></svg>